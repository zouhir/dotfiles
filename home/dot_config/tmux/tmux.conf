# Small on purpose: Ghostty handles local splits, tmux keeps SSH sessions alive.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-ghostty:RGB"

set -g mouse on
set -g set-clipboard on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
setw -g mode-keys vi

bind t new-window -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind Tab switch-client -l
bind , source-file ~/.config/tmux/tmux.conf

# TokyoNight Night
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[bg=#1a1b26] "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M "
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-style "fg=#292e42"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
